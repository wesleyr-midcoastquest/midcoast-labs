[DEFAULT]
# Service configuration: runs at every boot after OOBE.
# Cloudbase-Init's jobs here: metadata processing, host configuration,
# bootstrap launch (LocalScripts -> Initialize-LabRemoting.ps1).
# Static IP is NOT set here; bootstrap.ps1 sets it from inventory metadata.
username=Administrator
groups=Administrators
inject_user_password=false
first_logon_behaviour=no
netbios_host_name_compatibility=true

metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin

local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\
allow_reboot=true
stop_service_on_exit=false
check_latest_version=false
mtu_use_dhcp_config=true

bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\

verbose=true
debug=true
logdir=C:\ProgramData\MidCoastLab\Logs\Cloudbase-Init\
logfile=cloudbase-init.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN

[config_drive]
types=vfat,iso
locations=cdrom,hdd,partition
